<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Nirvana Compile</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d24">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--hd:#0f3d24;--bg:#07110b;--sf:#12241a;--tx:#e8f5ec;--mt:#8fb09c;--ac:#22c55e;--ln:#1f5a38;--fs:15px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Roboto,sans-serif}
*{box-sizing:border-box}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
svg{width:24px;height:24px;fill:currentColor}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;height:44px;background:var(--hd);padding:0 4px;flex:none}
.top button{width:40px;height:40px;display:grid;place-items:center}
.top .t{flex:1;font-size:16px;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#edw{flex:1;min-height:0;display:flex}
#gut{margin:0;width:38px;padding:10px 6px 10px 0;text-align:right;color:var(--mt);font:var(--fs)/1.5 ui-monospace,Menlo,monospace;overflow:hidden;user-select:none}
#cw{position:relative;flex:1;min-width:0;background:var(--bg)}
#hl,#ed{position:absolute;inset:0;margin:0;border:0;padding:10px 8px;font:var(--fs)/1.5 ui-monospace,Menlo,monospace;white-space:pre;tab-size:4}
#hl{color:var(--tx);overflow:hidden;pointer-events:none}
#ed{outline:0;resize:none;background:transparent;color:transparent;caret-color:var(--ac);overflow:auto}
#ed::selection{background:#22c55e66}
.kw{color:#c792ea}.cn{color:#ff7a90}.bi,.fc{color:#7fb7ff}.fn{color:#ffcb6b}.st{color:#9be37a}.nu{color:#f78c6c}.cm{color:#5f8a73}
.b0{color:#ffd700}.b1{color:#e879f9}.b2{color:#4fc1ff}.be{color:#ff4d4d;text-decoration:underline}
#run{position:absolute;right:14px;bottom:64px;height:44px;padding:0 18px 0 12px;border-radius:22px;background:var(--ac);color:#04210f;display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px;box-shadow:0 4px 14px #22c55e55}
#stat{flex:none;padding:2px 10px;font-size:11px;line-height:1.3;color:var(--mt);background:var(--sf);border-top:1px solid var(--ln)}
.top .t small{display:block;font-size:10px;font-weight:700;color:var(--ac);letter-spacing:.4px;line-height:1.1}#ttl{display:block;font-size:14px;line-height:1.2}
.seg{display:flex;flex:none;background:#0006;border-radius:18px;padding:2px;margin-right:2px}.seg button{width:auto;height:30px;padding:0 10px;border-radius:15px;font-size:13px;white-space:nowrap}.top .t{min-width:0}.seg button.on{background:var(--ac);color:#04210f;font-weight:700}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-radius:20px 20px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .22s}#sheet.on{transform:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;padding:8px 4px;border-radius:14px;background:var(--hd);font-size:13px;text-align:center}.tile i{font-style:normal;font-size:22px}
#bar{display:flex;overflow-x:auto;background:var(--hd);flex:none}
#bar button{flex:none;min-width:36px;height:36px;padding:0 10px;border-right:1px solid var(--ln);font:15px ui-monospace,monospace}
#scrim{position:fixed;inset:0;background:#0007;z-index:20}
#dr{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--sf);z-index:30;overflow-y:auto;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
#dr.on{transform:none}
.dh{background:var(--hd);padding:16px;font-size:15px;line-height:1.7}
.dh b{font-size:17px}.dh span{color:var(--mt);display:block;font-size:13px;line-height:1.5}
.sec{padding:14px 16px 6px;color:var(--mt);font-size:14px;border-top:1px solid #444}
.it{display:flex;align-items:center;gap:20px;width:100%;height:48px;padding:0 16px;text-align:left}
.it i{width:24px;font-style:normal;text-align:center;color:var(--mt)}
.scr{position:fixed;inset:0;background:var(--sf);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scr .top{background:var(--hd)}
#con{flex:1;overflow:auto;padding:12px;background:var(--bg);font:14px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap}
#con .e{color:#ff8a8a}#con .i{color:#7fa3c0}
#inp{display:flex;gap:8px;padding:8px;background:var(--hd)}#inp input{flex:1;min-width:0;height:44px;border:0;border-radius:6px;padding:0 12px;background:#000;color:var(--tx);font:16px ui-monospace,monospace;outline:0}#inp button{width:48px;border-radius:6px;background:var(--ac);color:#3a3000;font-size:20px}
#sl{flex:1;overflow:auto;padding:8px 16px}
#sl h4{margin:18px 0 4px;font-size:18px}#sl p{margin:0 0 4px;color:var(--mt);font-size:14px}#sl div{padding:10px 0}
#sl div b{display:block;font-weight:500;color:#cfd6dd}
#veil{position:fixed;inset:0;z-index:50}
#menu{position:fixed;top:52px;right:8px;z-index:60;background:#1a3326;border-radius:4px;min-width:200px;box-shadow:0 4px 14px #000a;padding:6px 0}
#menu button,.card button{display:block;width:100%;height:48px;padding:0 18px;text-align:left}
#dlg{position:fixed;inset:0;z-index:70;background:#0009;display:grid;place-items:center}
.card{background:#1a3326;border-radius:4px;width:82%;max-width:340px;padding:10px 0;max-height:80%;overflow:auto}
.card h3{margin:0;padding:12px 18px;font-size:19px;font-weight:500}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#444;padding:10px 16px;border-radius:20px;z-index:80;font-size:14px}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 38%,#14532d,#07110b 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .lg{width:96px;height:96px;border-radius:26px;background:#0f3d24;color:var(--ac);display:grid;place-items:center;box-shadow:0 8px 30px #22c55e55,inset 0 0 0 2px #22c55e55;font:700 36px ui-monospace,Menlo,monospace;animation:pop .7s ease both}
#splash h1{margin:24px 0 6px;font-size:30px;font-weight:700;letter-spacing:.5px;animation:up .7s .25s ease both}
#splash p{margin:0;color:var(--mt);font-size:15px;animation:up .7s .45s ease both}
#splash small{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));color:var(--mt);font-size:13px;text-align:center;animation:up .7s .8s ease both}
#splash small b{display:block;color:var(--tx);font-weight:600;font-size:15px;margin-top:3px}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
#eb{position:absolute;left:0;right:0;background:#ff4d4d24;border-left:3px solid #ff4d4d;pointer-events:none}
.ge{color:#ff6b6b;font-weight:700}
#err{flex:none;padding:3px 10px;font-size:12px;line-height:1.3;background:#3a1216;color:#ffd2d2;border-top:1px solid #ff4d4d66}#err div+div{color:#ffb3b3}
</style>
</head>
